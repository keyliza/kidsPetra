server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Comprimir respuestas de texto
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cachear los assets con hash de contenido
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Redirigir las llamadas a la API al contenedor 'api' de la misma red
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Descarga del PDF desde nuestro mismo origen: Drive responde 403 a las
    # peticiones fetch cross-site (Sec-Fetch-Site, que el navegador impone y JS
    # no puede alterar). Solo reenvia los bytes; el cliente arma el blob.
    location /drive/ {
        proxy_pass https://drive.usercontent.google.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host drive.usercontent.google.com;
        # Drive manda ~5.6 KB de cabeceras (Access-Control-Allow-Headers sola
        # pesa 4.6 KB); con el buffer por defecto de 4k nginx responde 502.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Fallback SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
