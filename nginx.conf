server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # pdf.js carga su worker como modulo y Chrome exige MIME de JavaScript;
    # el mime.types de nginx puede no mapear .mjs. 'types {}' vacia el mapa
    # para esta ruta, asi default_type siempre gana.
    location = /pdf.worker.min.mjs {
        root /usr/share/nginx/html;
        types { }
        default_type text/javascript;
    }

    # Descarga del PDF desde nuestro mismo origen: Drive responde 403 a las
    # peticiones fetch cross-site (Sec-Fetch-Site, que el navegador impone y JS
    # no puede alterar). Solo reenvia los bytes; el cliente arma el blob.
    location /drive/ {
        proxy_pass https://drive.usercontent.google.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host drive.usercontent.google.com;
        # Drive manda ~5.6 KB de cabeceras (Access-Control-Allow-Headers sola
        # pesa 4.6 KB); con el buffer por defecto de 4k nginx responde 502.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Caché para recursos estáticos (CSS, JS, imágenes, iconos)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
